name: mood_music_app
description: AI-powered mood-based music player
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.3

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # DI
  get_it: ^7.7.0
  injectable: ^2.4.1

  # Camera & CV
  camera: ^0.11.0
  tflite_flutter: ^0.12.0
  image: ^4.2.0

  # Music sources
  youtube_player_flutter: ^9.0.3
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # Networking
  dio: ^5.4.3

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Permissions
  permission_handler: ^11.3.1

  # UI
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # Utils
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.4.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.10
  injectable_generator: ^2.4.2
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/animations/